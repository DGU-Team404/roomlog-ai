name: Deploy to EC2

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase image name
        id: image
        run: |
          IMAGE=$(echo "${{ env.REGISTRY }}/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "name=$IMAGE" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Test EC2 connectivity
        run: nc -zv -w 30 ${{ secrets.EC2_HOST }} 22

      - name: Deploy to EC2
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          IMAGE: ${{ needs.build-and-push.outputs.image }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FAL_API_KEY: ${{ secrets.FAL_API_KEY }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          S3_REGION: ${{ secrets.S3_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          echo "$SSH_KEY" > /tmp/ec2_key.pem
          chmod 600 /tmp/ec2_key.pem

          ssh -i /tmp/ec2_key.pem \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=60 \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            IMAGE="$IMAGE" \
            GHCR_TOKEN="$GHCR_TOKEN" \
            GHCR_USER="$GHCR_USER" \
            OPENAI_API_KEY="$OPENAI_API_KEY" \
            FAL_API_KEY="$FAL_API_KEY" \
            S3_BUCKET_NAME="$S3_BUCKET_NAME" \
            S3_REGION="$S3_REGION" \
            AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
            AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" \
            bash -s << 'ENDSSH'

            if ! command -v docker &> /dev/null; then
              curl -fsSL https://get.docker.com | sh
              sudo usermod -aG docker ubuntu
              newgrp docker
            fi

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            docker pull "$IMAGE:latest"

            docker stop roomlog-ai 2>/dev/null || true
            docker rm roomlog-ai 2>/dev/null || true

            docker run -d \
              --name roomlog-ai \
              --restart always \
              -p 8000:8000 \
              -e OPENAI_API_KEY="$OPENAI_API_KEY" \
              -e FAL_API_KEY="$FAL_API_KEY" \
              -e S3_BUCKET_NAME="$S3_BUCKET_NAME" \
              -e S3_REGION="$S3_REGION" \
              -e AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
              -e AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" \
              "$IMAGE:latest"

            docker image prune -f
          ENDSSH

          rm /tmp/ec2_key.pem
